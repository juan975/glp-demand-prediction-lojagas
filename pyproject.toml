[project]
name = "lojagas"
version = "0.1.0"
description = "Predicción de demanda de GLP para C.E.M. Lojagas (TIC UTPL)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Juan Cristobal Espinosa Rodas" },
    { name = "Dara Van Gijsel Guarnizo" },
]
# Núcleo compartido por las imágenes Ingesta y ML
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "deltalake>=1.0",
    "pandera>=0.24",
]

[project.optional-dependencies]
# Contenedor Ingesta: solo extracción (Odoo API, HTTPS, PDF de Petroecuador)
ingesta = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
]
# Contenedor Procesamiento: curación e ingeniería de características (incluye SIG)
procesamiento = [
    "geopandas>=1.0",
]
# Contenedor ML (sin torch: se instala aparte, ver extra "lstm")
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "mlflow>=3.10",          # >=3.10 por CVE-2026-2652
    "shap>=0.46",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
]
# El servidor no tiene GPU: el Dockerfile ML instala torch CPU desde su índice
lstm = ["torch>=2.4"]

[project.scripts]
lojagas = "lojagas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lojagas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integracion: requiere servicios levantados (PostgreSQL, MLflow)",
]

[tool.coverage.run]
source = ["src/lojagas"]
