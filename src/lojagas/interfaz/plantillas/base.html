<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Predicción de demanda — Lojagas{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 24px;
           max-width: 1100px; margin-inline: auto; line-height: 1.5; }
    nav a { margin-right: 16px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border-bottom: 1px solid #ccc; padding: 8px 10px; text-align: left; }
    .aviso { border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Predicción de demanda de GLP</h1>
    <nav><a href="/">Tablero</a><a href="/reportes">Reportes</a></nav>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
