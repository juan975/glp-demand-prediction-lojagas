# Despliegue_v3 — un nodo on-premise (Lojagas), Docker Engine, Docker Compose.
# Contenedores de larga duración: postgres, mlflow, airflow-*, docker-proxy.
# Contenedores de trabajo efímeros (profile "jobs"): ingesta, procesamiento y ml. No corren solos:
# los lanza Airflow con DockerOperator a través del proxy del socket.

name: lojagas

x-airflow-common: &airflow-common
  build:
    context: docker/airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
  image: lojagas/airflow:${AIRFLOW_VERSION}
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/db_airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Guayaquil
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Variables que leen los DAGs para lanzar los contenedores de trabajo
    LOJAGAS_DATA_ROOT: ${LOJAGAS_DATA_ROOT}
    LOJAGAS_IMAGE_TAG: ${LOJAGAS_IMAGE_TAG}
    LOJAGAS_DOCKER_URL: tcp://docker-proxy:2375
    LOJAGAS_NETWORK: lojagas_net
    ODOO_URL: ${ODOO_URL}
    ODOO_DB: ${ODOO_DB}
    ODOO_API_KEY: ${ODOO_API_KEY}
    LOJAGAS_PII_SALT: ${LOJAGAS_PII_SALT}
  volumes:
    - ${LOJAGAS_REPO_ROOT:-.}/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
  networks: [lojagas_net]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
    volumes:
      - ${LOJAGAS_DATA_ROOT}/pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    networks: [lojagas_net]
    restart: unless-stopped

  mlflow:
    build: docker/mlflow
    image: lojagas/mlflow:local
    environment:
      MLFLOW_BACKEND_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/db_mlflow
    volumes:
      # Solo MLflow monta mlruns/: el contenedor ML accede por HTTP (proxy de artefactos)
      - ${LOJAGAS_DATA_ROOT}/mlruns:/mlruns
    ports:
      - "127.0.0.1:5000:5000"   # acceso solo por túnel SSH
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lojagas_net]
    restart: unless-stopped

  docker-proxy:
    # Expone al socket de Docker solo lo que DockerOperator necesita
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [lojagas_net]
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin \
          --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Lojagas --email admin@lojagas.local || true
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"   # acceso solo por túnel SSH
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Imágenes de trabajo: solo se construyen (make build) ---
  ingesta:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/ingesta/Dockerfile
    image: lojagas/ingesta:${LOJAGAS_IMAGE_TAG}

  procesamiento:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/procesamiento/Dockerfile
    image: lojagas/procesamiento:${LOJAGAS_IMAGE_TAG}

  ml:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/ml/Dockerfile
    image: lojagas/ml:${LOJAGAS_IMAGE_TAG}

networks:
  lojagas_net:
    name: lojagas_net   # nombre fijo: los DAGs conectan los contenedores aquí

volumes:
  airflow_logs:
