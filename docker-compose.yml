# Despliegue_v4 — un nodo on-premise (Lojagas), Docker Engine, Docker Compose.
# Contenedores de larga duración: postgres, mlflow, airflow-*, docker-proxy, interfaz.
# Contenedores de trabajo efímeros (profile "jobs"): ingesta, procesamiento y ml. No corren solos:
# los lanza Airflow con DockerOperator a través del proxy del socket.

name: lojagas

x-airflow-common: &airflow-common
  build:
    context: docker/airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
  image: lojagas/airflow:${AIRFLOW_VERSION}
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/db_airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?generar AIRFLOW_FERNET_KEY (ver .env.example)}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?generar AIRFLOW_JWT_SECRET (ver .env.example)}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Guayaquil
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    LOJAGAS_DATA_ROOT: ${LOJAGAS_DATA_ROOT}
    LOJAGAS_IMAGE_TAG: ${LOJAGAS_IMAGE_TAG}
    LOJAGAS_DOCKER_URL: tcp://docker-proxy:2375
    LOJAGAS_NETWORK: lojagas_net
    ODOO_URL: ${ODOO_URL}
    ODOO_DB: ${ODOO_DB}
    ODOO_API_KEY: ${ODOO_API_KEY}
    LOJAGAS_PII_SALT: ${LOJAGAS_PII_SALT:?generar LOJAGAS_PII_SALT antes de cualquier ingesta}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
  networks: [lojagas_net]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
    volumes:
      - ${LOJAGAS_DATA_ROOT}/pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    networks: [lojagas_net]
    restart: unless-stopped

  mlflow:
    build: docker/mlflow
    image: lojagas/mlflow:local
    environment:
      MLFLOW_BACKEND_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/db_mlflow
    volumes:
      # Solo MLflow monta mlruns/: el contenedor ML accede por HTTP (proxy de artefactos)
      - ${LOJAGAS_DATA_ROOT}/mlruns:/mlruns
    networks:
      lojagas_net:
        ipv4_address: 172.30.0.10   # IP fija: destino del túnel SSH del administrador
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  docker-proxy:
    # Expone al socket de Docker solo lo que DockerOperator necesita
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy_net]
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate || exit 1
        [ -n "$$(ls -A /opt/airflow/dags)" ] || { echo "ERROR: /opt/airflow/dags vacio; revisar el bind mount ./dags"; exit 1; }
        airflow users create --role Admin \
          --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Lojagas --email admin@lojagas.local \
          || echo "Aviso: no se creó el usuario (¿ya existe?)"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      lojagas_net:
        ipv4_address: 172.30.0.11
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [lojagas_net, proxy_net]
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Imágenes de trabajo: solo se construyen (make build) ---
  ingesta:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/ingesta/Dockerfile
    image: lojagas/ingesta:${LOJAGAS_IMAGE_TAG}

  procesamiento:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/procesamiento/Dockerfile
    image: lojagas/procesamiento:${LOJAGAS_IMAGE_TAG}

  ml:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/ml/Dockerfile
    image: lojagas/ml:${LOJAGAS_IMAGE_TAG}

  # --- Tablero de consulta: único aplicativo permanente (ADR-0011) ---
  interfaz:
    build:
      context: .
      dockerfile: docker/interfaz/Dockerfile
    image: lojagas/interfaz:${LOJAGAS_IMAGE_TAG}
    environment:
      LOJAGAS_LAKEHOUSE: /data/lakehouse
      LOJAGAS_REPORTES: /data/reportes
    volumes:
      # Solo la zona de predicciones y los reportes, y en solo lectura.
      # Raw, Curated y Feature contienen PII y este contenedor no las monta.
      - ${LOJAGAS_DATA_ROOT}/lakehouse/predicciones:/data/lakehouse/predicciones:ro
      - ${LOJAGAS_DATA_ROOT}/reportes:/data/reportes:ro
    ports:
      # Atado a la IP interna del servidor, nunca a 0.0.0.0 (ADR-0012).
      # El cortafuegos restringe además el origen a la subred de planificación.
      - "${LOJAGAS_LAN_IP:?definir LOJAGAS_LAN_IP en .env}:${LOJAGAS_INTERFAZ_PUERTO:-8000}:8000"
    networks: [interfaz_net]
    restart: unless-stopped

networks:
  lojagas_net:
    name: lojagas_net   # nombre fijo: los DAGs conectan los contenedores aquí
    ipam:
      config:
        - subnet: 172.30.0.0/24
  proxy_net:
    # Solo scheduler y proxy. Un puerto publicado es alcanzable desde cualquier
    # red bridge, así que el proxy nunca publica y vive en una red propia.
    name: lojagas_proxy_net
    internal: true
  interfaz_net:
    # Red propia y sin nadie más dentro: el tablero no tiene ruta hacia
    # PostgreSQL, MLflow ni el proxy del socket. El aislamiento no depende de
    # configurarlo bien, depende de que no tenga a dónde ir.
    name: lojagas_interfaz_net

volumes:
  airflow_logs:
